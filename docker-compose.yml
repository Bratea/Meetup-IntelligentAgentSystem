name: xunwu-agent

services:
  # ===================== PostgreSQL + pgvector =====================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: xunwu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xunwu_agent
      POSTGRES_USER: xunwu
      POSTGRES_PASSWORD: xunwu123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xunwu -d xunwu_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - xunwu-net

  # ===================== Ollama (本地模型) =====================
  ollama:
    image: ollama/ollama:latest
    container_name: xunwu-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - xunwu-net

  # ===================== 后端服务 (Spring Boot) =====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xunwu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_URL: jdbc:postgresql://xunwu-postgres:5432/xunwu_agent
      DB_USERNAME: xunwu
      DB_PASSWORD: xunwu123
      OLLAMA_BASE_URL: http://xunwu-ollama:11434
      # 未配置时为空串；后端 ApiKeyPlaceholderEnvironmentPostProcessor
      # 会把空串改写为占位值，避免 Spring AI 的非空断言导致启动失败
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      # LongCat：未配置时为空串，后端会把该模型标记为不可用
      LONGCAT_API_KEY: ${LONGCAT_API_KEY:-}
      LONGCAT_BASE_URL: ${LONGCAT_BASE_URL:-https://api.longcat.chat/openai/v1}
      LONGCAT_MODEL: ${LONGCAT_MODEL:-LongCat-2.5}
      # 接口鉴权令牌：留空则后端关闭鉴权（不推荐用于对外部署）
      XUNWU_AUTH_TOKEN: ${XUNWU_AUTH_TOKEN:-}
    ports:
      - "8080:8080"
    networks:
      - xunwu-net

  # ===================== 前端服务 (React + nginx) =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xunwu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - xunwu-net

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

networks:
  xunwu-net:
    driver: bridge
