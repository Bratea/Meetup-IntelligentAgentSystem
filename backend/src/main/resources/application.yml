server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: xunwu-agent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xunwu_agent}
    username: ${DB_USERNAME:xunwu}
    password: ${DB_PASSWORD:xunwu123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  ai:
    # DeepSeek（OpenAI 兼容协议）
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      # Spring AI 的 OpenAiChatAutoConfiguration 对 api-key 有 Assert.hasText 校验，
      # 不配置 DEEPSEEK_API_KEY 会直接导致应用启动失败。
      # 这里用占位值兜底；未配置时 deepseek-chat 会被标记为不可用（available=false），
      # 前端不会展示、用户也不会选中，更不会被真正调用。
      api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    # 智谱 GLM
    zhipuai:
      # 同上：占位值兜底，未配置 ZHIPU_API_KEY 时 glm-4-plus 标记为不可用
      api-key: ${ZHIPU_API_KEY:sk-not-configured}
      chat:
        options:
          model: glm-4-plus
          temperature: 0.7
    # Ollama 本地模型
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0.7
      embedding:
        options:
          model: bge-m3

# LongCat（OpenAI 兼容协议）
# ChatClientRegistry 用 OpenAiChatModel 手工构造；未配置 api-key 时模型标记为不可用
longcat:
  base-url: ${LONGCAT_BASE_URL:https://api.longcat.chat/openai/v1}
  api-key: ${LONGCAT_API_KEY:}
  model: ${LONGCAT_MODEL:LongCat-2.5}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.xunwu.agent.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler

# 寻晤智能agent系统 自定义配置
xunwu:
  agent:
    # 单次任务最大执行步数（防止智能体无限循环）
    max-steps: 8
    # 默认模型
    default-model: qwen2.5:7b
  rag:
    # Top-K 检索数量
    top-k: 4
    # 文档分段长度
    chunk-size: 500
    # 分段重叠长度
    chunk-overlap: 50
    # 向量维度（bge-m3）
    embedding-dimensions: 1024

logging:
  level:
    com.xunwu.agent: info
    org.springframework.ai: warn

# 健康检查（供 Docker / K8s 探针使用）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
